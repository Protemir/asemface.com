<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Әсем Жол: ночная гонка по Алматы</title>
<meta name="description" content="Браузерная гонка по Алматы и горам вокруг: ночной город, дорога на Медеу, Шымбулак на рассвете, Капчагай на закате и Чарынский каньон. Сюжет из пяти глав и свободная езда.">
<link rel="canonical" href="https://asemface.com/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Әсем Жол">
<meta name="theme-color" content="#070b1a">
<meta property="og:type" content="website">
<meta property="og:url" content="https://asemface.com/">
<meta property="og:title" content="Әсем Жол: гонка по Алматы и горам">
<meta property="og:description" content="Ночной город, Медеу, Шымбулак, Капчагай и Чарын. Пять глав сюжета и свободная езда прямо в браузере.">
<meta property="og:image" content="https://asemface.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="style.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<canvas id="game" aria-label="Әсем Жол"></canvas>

<div class="hud" id="hud" hidden>
  <div class="hud-block hud-left">
    <p class="speed"><b id="hudSpeed">0</b> <span id="hudKmh">км/ч</span></p>
    <p class="dist" id="hudDist"></p>
    <div class="nitro" aria-hidden="true"><i id="hudNitro"></i></div>
  </div>
  <div class="hud-block hud-center">
    <p class="time" id="hudTime">0</p>
    <p class="zone" id="hudZone"></p>
    <p class="place" id="hudPlace"></p>
    <p class="style-total" id="hudStyle"></p>
    <p class="style-gain" id="hudGain" aria-hidden="true"></p>
  </div>
  <div class="hud-right">
    <div class="hud-btns">
      <button type="button" class="icon-btn" id="pauseBtn" aria-label="Пауза">II</button>
      <button type="button" class="icon-btn" id="musicBtn" aria-label="Музыка">♪</button>
      <button type="button" class="icon-btn" id="muteBtn">Звук</button>
    </div>
    <button type="button" class="icon-btn" id="fullBtn" aria-label="На весь экран" hidden></button>
  </div>
</div>

<div class="banner" id="banner" aria-live="polite"></div>
<div class="ach-toast" id="achToast" aria-live="polite"></div>
<button type="button" class="nitro-btn" id="nitroBtn" hidden aria-label="Нитро">N</button>
<button type="button" class="horn-btn" id="hornBtn" hidden>Бип</button>

<div id="ui"></div>

<noscript><p class="noscript">Для игры нужен JavaScript.</p></noscript>
</body>
</html>
