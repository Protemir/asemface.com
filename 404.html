<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Әсем Жол переехала на gamemetric.dev/asem/</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://gamemetric.dev/asem/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff8a3d'/%3E%3C/svg%3E">
<script>
  // Әсем Жол now lives at gamemetric.dev/asem/. The saves of this browser go along in the address
  // (#move=<base64url of {key: value}>), the game puts them back into its own storage once.
  (function () {
    var to = 'https://gamemetric.dev/asem/' + location.search;
    try {
      var data = {};
      var n = 0;
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf('asem.') === 0) {
          data[k] = localStorage.getItem(k);
          n++;
        }
      }
      if (n) to += '#move=' + btoa(unescape(encodeURIComponent(JSON.stringify(data)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    } catch (e) {}
    location.replace(to);
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://gamemetric.dev/asem/"></noscript>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #070b1a; color: #f3eef6;
         font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; text-align: center; padding: 24px; }
  a { color: #ffb547; }
</style>
</head>
<body>
<p>Әсем Жол теперь здесь: <a href="https://gamemetric.dev/asem/">gamemetric.dev/asem/</a></p>
</body>
</html>
