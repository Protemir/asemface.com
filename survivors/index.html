<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Noob Survivors.io</title>
<meta name="description" content="3D party survival arena in the browser: dodge giant hammers, spinning sweepers and rolling balls, shove the other noobs off and be the last one standing.">
<meta name="theme-color" content="#3d9cff">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Noob Survivors.io">
<meta property="og:description" content="Dodge, shove, survive. Last noob standing wins.">
<meta property="og:url" content="https://asemface.com/survivors/">
<meta property="og:image" content="https://asemface.com/survivors/og.png">
  <script type="module" crossorigin src="./assets/index-BVgJc0f7.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-Bp0H86kS.css">
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="hud" class="hidden">
    <button id="pauseBtn" class="icon-btn" aria-label="Pause"><span></span><span></span></button>
    <div id="topbar">
      <div id="timer">0:00</div>
      <div id="alive"><b>24</b> <span></span></div>
    </div>
    <div id="roundCoins"><i class="coin"></i><b>0</b></div>
    <div id="banner"></div>
    <div id="feed"></div>
    <div id="power"><canvas width="88" height="88"></canvas><span></span></div>
    <div id="dashMeter"><canvas width="64" height="64"></canvas><span>SHIFT</span></div>
    <div id="hints"></div>
    <div id="count"></div>
    <div id="pop"></div>
    <div id="spectate" class="hidden"><span></span><button class="btn small yellow" data-act="retry"></button></div>
  </div>
  <div id="touch">
    <div id="stick"><div id="knob"></div></div>
    <button id="tJump" class="tbtn" aria-label="Jump"><svg viewBox="0 0 40 40"><path d="M20 6 L34 22 H25 V34 H15 V22 H6 Z" fill="#fff"/></svg></button>
    <button id="tDash" class="tbtn dash" aria-label="Dash"><svg viewBox="0 0 40 40"><path d="M6 14 H22 L18 8 L34 20 L18 32 L22 26 H6 Z" fill="#fff"/></svg><canvas width="96" height="96"></canvas></button>
  </div>
  <div id="screens"></div>
  <div id="boot"><div class="logo-small">NOOB SURVIVORS<span>.io</span></div><div class="spin"></div></div>
</div>
</body>
</html>
